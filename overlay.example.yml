# Headless/TUI overlay for a profile that has no web UI.
# Usage: dsh --profile headless --patch /absolute/path/overlay.example.yml "your task"
- id: dsh-subscriptions
  name: '@goodandready/dsh-subscriptions'
  config:
    composerQuota: percent
    composerQuotaDisplay: current
    rotationStrategy: least-loaded
    # #1094: a static OpenAI-compatible vendor needs no code — just a profile.
    # `protocol: chat` skips the OAuth trio (authUrl/tokenUrl/clientId) that the
    # default Responses-API profiles require.
    customVendors:
      - protocol: chat
        id: myvendor
        displayName: My Vendor
        baseUrl: https://api.myvendor.example
        authStyle: bearer
        models:
          - id: my-model
            name: My Model
            contextWindow: 128000
            maxTokens: 4096
    # #1128: a pack can also say where its quota comes from, so the pool rotates
    # on it without a hand-written vendor module. Omit `quota` and the pack still
    # works — usage is then reported as unknown instead of guessed.
    providerPacks:
      - id: myvendor-pack
        displayName: My Vendor
        authUrl: https://auth.myvendor.example/authorize
        tokenUrl: https://auth.myvendor.example/token
        baseUrl: https://api.myvendor.example
        clientId: my-client-id
        quota:
          path: /usage
          extract: deepest
          credits: auto
